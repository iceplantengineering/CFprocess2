<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Carbon Fiber Manufacturing System</title>
    <link rel="stylesheet" href="common-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--primary-blue-light) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .landing-container {
            max-width: 900px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-2xl);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .landing-title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .landing-subtitle {
            font-size: 1.5rem;
            margin-bottom: 32px;
            opacity: 0.9;
        }

        .kpi-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 24px;
            border-radius: var(--radius-xl);
            transition: all 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.3);
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .kpi-label {
            font-size: 1rem;
            opacity: 0.8;
        }

        .cta-button {
            display: inline-block;
            padding: 18px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-blue);
            background-color: white;
            border-radius: var(--radius-lg);
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-lg);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-xl);
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <h1 class="landing-title">Carbon Fiber Manufacturing System</h1>
        <p class="landing-subtitle">A Digital Twin for Real-time Monitoring and Process Optimization.</p>

        <div class="kpi-overview">
            <div class="kpi-card">
                <div class="kpi-value">85.2%</div>
                <div class="kpi-label">Overall Efficiency</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value">142 kg/hr</div>
                <div class="kpi-label">Production Rate</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value">98.7%</div>
                <div class="kpi-label">Quality Rate</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-value">3</div>
                <div class="kpi-label">Active Alerts</div>
            </div>
        </div>

        <a href="main_dashboard.html" class="cta-button">
            <i class="fas fa-arrow-right"></i> Enter Dashboard
        </a>
    </div>
</body>
</html>
